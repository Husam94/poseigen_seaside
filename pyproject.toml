[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "poseigen_seaside"
version = "0.1.1"
description = "Core utilities for the Poseigen package family"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.12"
license = { text = "MIT" }
license-files = ["LICENSE.txt"]
authors = [{ name = "Husam Abdulnabi", email = "husam.abdulnabi@gmail.com" }]
maintainers = [{ name = "Husam Abdulnabi", email = "husam.abdulnabi@gmail.com" }]
keywords = ["poseigen", "bioinformatics", "machine-learning", "utilities"]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Topic :: Scientific/Engineering",
  "Topic :: Software Development",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
]

dependencies = [
  "numpy",
  "scipy",
  "matplotlib",
  "denseweight",
  "tqdm",
  "torch",
  "torch-betainc",
]

[project.optional-dependencies]
dev = [
  "build",
  "twine",
  "pytest",
]

[project.urls]
Homepage = "https://github.com/husam94/poseigen_seaside"
Repository = "https://github.com/husam94/poseigen_seaside"
Issues = "https://github.com/husam94/poseigen_seaside/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]